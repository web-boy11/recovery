<svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer gold ring -->
  <circle cx="100" cy="100" r="96" fill="#1a3a6b" stroke="#c9a227" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#c9a227" stroke-width="1.5" />

  <!-- Red ring -->
  <circle cx="100" cy="100" r="82" fill="#0b1f3a" stroke="#8b1a2b" stroke-width="3" />
  <circle cx="100" cy="100" r="76" fill="none" stroke="#8b1a2b" stroke-width="0.5" />

  <!-- Inner field -->
  <circle cx="100" cy="100" r="74" fill="#f5f0df" />

  <!-- Center Shield -->
  <g>
    <path
      d="M 100 50 L 130 62 L 130 92 C 130 115 115 132 100 142 C 85 132 70 115 70 92 L 70 62 Z"
